name: "ČEZ PND Scraper"
version: "0.5.1"
slug: "cez_pnd_scraper"
description: "Imports delayed ČEZ PND consumption into Home Assistant long-term statistics."
arch:
  - amd64
startup: application
boot: auto
stage: experimental
homeassistant: "2026.11.0"
timeout: 90
tmpfs: true
homeassistant_api: true
ports:
  8099/tcp: null
watchdog: "http://[HOST]:[PORT:8099]/health"
options:
  email: null
  password: null
  elm: ""
  import_hour: 6
  import_minute: 30
  retry_minutes: 60
  backfill_from: ""
  correction_days: 7
  writer_mode: legacy
  bridge_token: ""
  add_to_energy_dashboard: true
  statistic_id: ""
  timezone: "Europe/Prague"
  log_level: "info"
schema:
  email: email
  password: password
  elm: str
  import_hour: "int(0,23)"
  import_minute: "int(0,59)"
  retry_minutes: "int(15,360)"
  backfill_from: str
  correction_days: "int(0,90)"
  writer_mode: "list(legacy|native)"
  bridge_token: password
  add_to_energy_dashboard: bool
  statistic_id: str
  timezone: str
  log_level: "list(debug|info|warn|error)"
