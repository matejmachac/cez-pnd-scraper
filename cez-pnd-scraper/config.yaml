name: "ČEZ PND Scraper"
version: "0.1.0"
slug: "cez_pnd_scraper"
description: "Publishes the newest 15-minute ČEZ PND power reading to Home Assistant via MQTT."
arch:
  - amd64
startup: application
boot: auto
stage: experimental
timeout: 90
tmpfs: true
services:
  - mqtt:need
ports:
  8099/tcp: null
watchdog: "http://[HOST]:[PORT:8099]/health"
options:
  email: null
  password: null
  elm: ""
  interval_minutes: 15
  offset_minutes: 3
  stale_after_minutes: 60
  timezone: "Europe/Prague"
  log_level: "info"
schema:
  email: email
  password: password
  elm: str
  interval_minutes: "int(5,120)"
  offset_minutes: "int(0,119)"
  stale_after_minutes: "int(15,360)"
  timezone: str
  log_level: "list(debug|info|warn|error)"
