configuration:
  email:
    name: PND email
    description: Email address used to sign in to the ČEZ Distribuce PND portal.
  password:
    name: PND password
    description: Password used to sign in to the ČEZ Distribuce PND portal.
  elm:
    name: ELM number
    description: Optional meter number. Leave empty only when the account has one +A kW column.
  import_hour:
    name: Daily import hour
    description: Local hour of the regular attempt to import yesterday.
  import_minute:
    name: Daily import minute
    description: Local minute of the regular import attempt.
  retry_minutes:
    name: Retry interval
    description: Minutes until another attempt when yesterday's data is still incomplete.
  add_to_energy_dashboard:
    name: Add to Energy dashboard
    description: Automatically adds ČEZ PND consumption as grid import after the first import and preserves other sources.
  statistic_id:
    name: Statistic ID
    description: Optional stable ID. Empty creates cez_pnd:consumption_<ELM>.
  timezone:
    name: Time zone
    description: IANA time zone used to interpret PND timestamps and schedule imports.
  log_level:
    name: Log level
    description: Verbosity of app logs.
