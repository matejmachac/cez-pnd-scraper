configuration:
  email:
    name: PND e-mail
    description: E-mail používaný pro přihlášení do portálu ČEZ Distribuce PND.
  password:
    name: PND heslo
    description: Heslo používané pro přihlášení do portálu ČEZ Distribuce PND.
  elm:
    name: Číslo ELM
    description: Volitelné číslo elektroměru. Prázdné ponechte jen u účtu s jediným sloupcem +A v kW.
  import_hour:
    name: Hodina denního importu
    description: Místní hodina pravidelného pokusu o import včerejšího dne.
  import_minute:
    name: Minuta denního importu
    description: Místní minuta pravidelného pokusu o import.
  retry_minutes:
    name: Interval opakování
    description: Počet minut do dalšího pokusu, když včerejší data ještě nejsou kompletní.
  add_to_energy_dashboard:
    name: Přidat do Energy Dashboardu
    description: Po prvním importu automaticky přidá spotřebu ČEZ PND jako odběr ze sítě a zachová ostatní zdroje.
  statistic_id:
    name: ID statistiky
    description: Volitelné stabilní ID. Prázdná hodnota vytvoří cez_pnd:consumption_<ELM>.
  timezone:
    name: Časová zóna
    description: IANA časová zóna pro interpretaci časů z PND a plánování importu.
  log_level:
    name: Úroveň logování
    description: Podrobnost logů aplikace.
