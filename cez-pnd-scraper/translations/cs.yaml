configuration:
  email:
    name: PND e-mail
    description: E-mail používaný pro přihlášení do portálu ČEZ Distribuce PND.
  password:
    name: PND heslo
    description: Heslo používané pro přihlášení do portálu ČEZ Distribuce PND.
  elm:
    name: Číslo ELM
    description: Volitelné číslo elektroměru. Prázdné ponechte jen u účtu s jediným sloupcem +A v kW.
  import_hour:
    name: Hodina denního importu
    description: Místní hodina pravidelného pokusu o import včerejšího dne.
  import_minute:
    name: Minuta denního importu
    description: Místní minuta pravidelného pokusu o import.
  retry_minutes:
    name: Interval opakování
    description: Počet minut do dalšího pokusu, když některý požadovaný den není kompletní nebo import selže.
  backfill_from:
    name: Doplnit historii od data
    description: Volitelné počáteční datum (YYYY-MM-DD) pro přepočet historie až do včerejška včetně. Prázdná hodnota automaticky doplní dny po posledním úspěšném importu.
  add_to_energy_dashboard:
    name: Přidat do Energy Dashboardu
    description: Po prvním importu automaticky přidá spotřebu ČEZ PND jako odběr ze sítě a zachová ostatní zdroje.
  statistic_id:
    name: ID statistiky
    description: Volitelné stabilní ID. Prázdná hodnota vytvoří cez_pnd:consumption_<ELM>.
  timezone:
    name: Časová zóna
    description: IANA časová zóna pro interpretaci časů z PND a plánování importu.
  log_level:
    name: Úroveň logování
    description: Podrobnost logů aplikace.
  correction_days:
    name: Zpětná kontrola měření
    description: Počet již importovaných dní, které se denně znovu načtou kvůli opravám PND (0–90).
  writer_mode:
    name: Zapisovač statistik
    description: Legacy zachovává samostatný scraper. Native předá zápis Recorderu nativní integraci a vypne původní plánovač.
  bridge_token:
    name: Token nativního transportu
    description: Soukromý token pro spojení s nativní integrací. Nevkládejte sem heslo k PND.
